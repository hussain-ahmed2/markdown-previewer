<!DOCTYPE html>
<html>
<head>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false });
    const { svg } = await mermaid.render('graph1', 'graph TD;\nA-->B;');
    console.log("Does it have xmlns?", svg.includes('xmlns="http://www.w3.org/2000/svg"'));
    const div = document.createElement('div');
    div.innerHTML = svg;
    const serializer = new XMLSerializer();
    const str = serializer.serializeToString(div.firstChild);
    console.log("Serialized:", str.substring(0, 100));
  </script>
</head>
<body></body>
</html>
