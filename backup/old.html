def quicksort(arr):

    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]

      marked.setOptions({
        breaks: true,
        gfm: true,
      });

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      const highlightExt = {
        name: "highlight",
        level: "inline",
        start(src) {
          return src.indexOf("==");
        },
        tokenizer(src) {
          const m = src.match(/^==([^=\n]+)==/);
          if (!m) return undefined;
          return { type: "highlight", raw: m[0], text: m[1] };
        },
        renderer(token) {
          return `<mark>${escapeHtml(token.text)}</mark>`;
        },
      };

      const inlineMath = {
        name: "inlineMath",
        level: "inline",
        start(src) {
          let i = src.indexOf("$");
          while (i !== -1 && src[i - 1] === "\\") i = src.indexOf("$", i + 1);
          return i;
        },
        tokenizer(src) {
          const m = src.match(/^(?!\$\$)\$(?!\s)([^$\n]+?)(?<!\s)\$/);
          if (!m) return undefined;
          return { type: "inlineMath", raw: m[0], text: m[1].trim() };
        },
        renderer(token) {
          return katex.renderToString(token.text, { throwOnError: false });
        },
      };

      const blockMath = {
        name: "blockMath",
        level: "block",
        tokenizer(src) {
          const m = src.match(/^\$\$([\s\S]+?)\$\$(?:\n|$)/);
          if (!m) return undefined;
          return { type: "blockMath", raw: m[0], text: m[1].trim() };
        },
        renderer(token) {
          return katex.renderToString(token.text, {
            throwOnError: false,
            displayMode: true,
          });
        },
      };

      const defList = {
        name: "defList",
        level: "block",
        tokenizer(src) {
          const m = src.match(/^([^\n:][^\n]*)\n((?::.*(?:\n|$))+)/);
          if (!m) return undefined;
          const term = m[1].trim();
          if (
            !term ||
            /^[#>]/.test(term) ||
            /^(?:-{3,}|\*{3,}|_{3,})\s*$/.test(term)
          )
            return undefined;
          const items = [];
          let current = null;
          for (const line of (m[1] + "\n" + m[2]).split("\n")) {
            if (line.trim() === "") continue;
            if (line.startsWith(":")) {
              if (!current) current = { termTokens: [], defs: [] };
              current.defs.push(this.lexer.inlineTokens(line.slice(1).trim()));
            } else {
              if (current) items.push(current);
              current = {
                termTokens: this.lexer.inlineTokens(line.trim()),
                defs: [],
              };
            }
          }
          if (current) items.push(current);
          return { type: "defList", raw: m[0], items };
        },
        renderer(token) {
          const body = token.items
            .map((it) => {
              const dt = `<dt>${this.parser.parseInline(it.termTokens)}</dt>`;
              const dd = it.defs
                .map((d) => `<dd>${this.parser.parseInline(d)}</dd>`)
                .join("");
              return dt + dd;
            })
            .join("");
          return `<dl>\n${body}\n</dl>\n`;
        },
      };

      marked.use(markedFootnote());

      marked.use({
        extensions: [highlightExt, inlineMath, blockMath, defList],
        renderer: {
          code(token) {
            const lang = (token.lang || "").trim();
            const text = token.text.replace(/\n$/, "");
            if (lang === "mermaid") {
              return `<pre><code class="language-mermaid">${escapeHtml(text)}</code></pre>\n`;
            }
            if (lang && hljs.getLanguage(lang)) {
              try {
                const hl = hljs.highlight(text, { language: lang }).value;
                return `<pre><code class="language-${escapeHtml(lang)} hljs">${hl}</code></pre>\n`;
              } catch (e) {
                /* fall through */
              }
            }
            return `<pre><code${lang ? ` class="language-${escapeHtml(lang)}"` : ""}>${escapeHtml(text)}</code></pre>\n`;
          },
        },
      });

      function renderMarkdown() {
        const html = marked.parse(editor.value);
        preview.innerHTML = DOMPurify.sanitize(html, {
          ADD_TAGS: [
            "math",
            "annotation",
            "annotation-xml",
            "mi",
            "mn",
            "mo",
            "ms",
            "mtext",
            "mspace",
            "msqrt",
            "mroot",
            "mfrac",
            "mrow",
            "msub",
            "msup",
            "msubsup",
            "munder",
            "mover",
            "munderover",
            "mtable",
            "mtr",
            "mtd",
            "semantics",
            "maction",
          ],
        });
        renderMermaid();

      function getMermaidConfig() {
        const isDark = document.documentElement.classList.contains("dark");
        return {
          startOnLoad: false,
          securityLevel: "strict",
          theme: isDark ? "dark" : "default",
          themeVariables: { fontFamily: "'Inter', sans-serif" },
        };
      }

      let mermaidSeq = 0;

      function getMermaidSource(raw) {
        if (!document.documentElement.classList.contains("dark")) return raw;
        return raw.replace(
          /^\s*(style|classDef)\s+\S+\s+(?:fill|stroke|color):.*$/gm,
          "",
        );
      }

      async function renderMermaidDiagrams(wrappers) {
        for (const w of wrappers) {
          try {
            const id = "mmd-" + ++mermaidSeq;
            const { svg } = await mermaid.render(
              id,
              getMermaidSource(w.dataset.mermaid),
            );
            w.innerHTML = svg;
          } catch (err) {
            console.error("Mermaid render failed:", err);
            w.innerHTML =
              '<div class="mermaid-error">Failed to render Mermaid diagram</div>';
          }
        }
      }

      function renderMermaid() {
        const wrappers = [];
        preview
          .querySelectorAll("pre code.language-mermaid")
          .forEach((code) => {
            const pre = code.closest("pre");
            const w = document.createElement("div");
            w.className = "mermaid-diagram";
            w.dataset.mermaid = code.textContent.trim();
            pre.replaceWith(w);
            wrappers.push(w);
          });
        renderMermaidDiagrams(wrappers);
      }

      editor.addEventListener("input", renderMarkdown);

      editor.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          const value = editor.value;
          editor.value =
            value.substring(0, start) + "  " + value.substring(end);
          editor.selectionStart = editor.selectionEnd = start + 2;
          renderMarkdown();
        }
      });

      loadExampleBtn.addEventListener("click", () => {
        editor.value = exampleMarkdown;
        renderMarkdown();
        editor.focus();
      });

      openFileBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          editor.value = ev.target.result;
          renderMarkdown();
          document.title = file.name + " — Markdown Previewer";
        };
        reader.onerror = () => alert("Failed to read file.");
        reader.readAsText(file);
        fileInput.value = "";
      });

      const pdfModal = document.getElementById("pdfModal");
      const pdfModalBackdrop = document.getElementById("pdfModalBackdrop");
      const pdfDirectBtn = document.getElementById("pdfDirectBtn");
      const pdfPrintBtn = document.getElementById("pdfPrintBtn");
      const optHeader = document.getElementById("optHeader");
      const optFooter = document.getElementById("optFooter");
      const optHeaderTitle = document.getElementById("optHeaderTitle");
      const headerTextWrapper = document.getElementById("headerTextWrapper");

      optHeader.addEventListener("change", (e) => {
        if (e.target.checked) {
          headerTextWrapper.classList.remove(
            "opacity-50",
            "pointer-events-none",
          );
        } else {
          headerTextWrapper.classList.add("opacity-50", "pointer-events-none");
        }
      });

      const pdfCancelBtn = document.getElementById("pdfCancelBtn");
      const pdfProgress = document.getElementById("pdfProgress");
      const pdfProgressText = document.getElementById("pdfProgressText");
      const pdfProgressCount = document.getElementById("pdfProgressCount");
      const pdfProgressBar = document.getElementById("pdfProgressBar");

      function openPdfModal() {
        pdfProgress.classList.add("hidden");
        pdfDirectBtn.disabled = false;
        pdfPrintBtn.disabled = false;
        pdfModal.classList.remove("hidden");
      }

      function closePdfModal() {
        pdfModal.classList.add("hidden");
      }

      function setProgress(frac, label) {
        pdfProgress.classList.remove("hidden");
        pdfProgressBar.style.width = Math.round(frac * 100) + "%";
        pdfProgressCount.textContent = label;
      }

      function buildPdfClone() {
        const clone = preview.cloneNode(true);
        clone.removeAttribute("id");
        clone.className = "prose prose-gray max-w-none bg-white";
        clone.style.fontFamily = "'Inter', sans-serif";
        clone.style.fontSize = "12pt";
        clone.style.width = "170mm";
        clone.style.padding = "0";
        clone.style.margin = "0";
        clone.style.boxSizing = "border-box";
        clone.style.lineHeight = "1.6";
        clone.style.color = "#1f2937";

        const style = document.createElement("style");
        style.textContent = `
          .prose pre { background: #f6f8fa; color: #24292e; padding: 1rem; border-radius: 0.5rem; overflow-x: visible; white-space: pre-wrap; word-break: break-word; page-break-inside: avoid; }
          .prose code { background: #f1f1f1; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875em; font-family: 'JetBrains Mono', monospace; word-break: break-word; }
          .prose pre code { background: transparent; padding: 0; font-size: inherit; white-space: pre-wrap; word-break: break-word; }
          .prose table { border-collapse: collapse; width: 100%; margin: 1rem 0; page-break-inside: auto; }
          .prose th, .prose td { border: 1px solid #d1d5db; padding: 0.5rem 0.75rem; text-align: left; }
          .prose th { background: #f3f4f6; font-weight: 600; }
          .prose tr:nth-child(even) td { background: #f9fafb; }
          .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; margin: 1rem 0; color: #6b7280; font-style: italic; }
          .prose h1 { font-size: 2rem; font-weight: 700; margin: 2rem 0 1rem; color: #111827; page-break-after: avoid; }
          .prose h2 { font-size: 1.5rem; font-weight: 600; margin: 1.75rem 0 0.75rem; color: #1f2937; page-break-after: avoid; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; }
          .prose h3 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: #374151; page-break-after: avoid; }
          .prose h4 { font-size: 1.125rem; font-weight: 600; margin: 1.25rem 0 0.5rem; color: #374151; page-break-after: avoid; }
          .prose p { margin: 0.75rem 0; }
          .prose ul, .prose ol { margin: 0.75rem 0; padding-left: 1.5rem; }
          .prose li { margin: 0.25rem 0; }
          .prose img { max-width: 100%; height: auto; border-radius: 0.5rem; }
          .prose hr { border: none; border-top: 2px solid #e5e7eb; margin: 2rem 0; }
          .prose a { color: #2563eb; text-decoration: underline; }
          .prose strong { font-weight: 600; }
          .prose em { font-style: italic; }
          .prose del { text-decoration: line-through; }
          @media print {
            .prose { padding: 0; }
            .prose pre { background: #f6f8fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .prose code { background: #f1f1f1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .prose th { background: #f3f4f6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .prose tr:nth-child(even) td { background: #f9fafb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          }
        `;
        clone.prepend(style);
        document.body.appendChild(clone);
        return clone;
      }

      async function exportDocument(action) {
        pdfDirectBtn.disabled = true;
        pdfPrintBtn.disabled = true;
        pdfProgressText.textContent = "Preparing content...";
        pdfProgressBar.style.width = "2%";
        pdfProgressCount.textContent = "";
        pdfProgress.classList.remove("hidden");

        let clone = null;
        try {
          clone = buildPdfClone();

          const { jsPDF } = window.jspdf;
          const scale = 2;
          const pageW = 210;
          const pageH = 297;
          const margin = 24;
          const printW = pageW - margin * 2;
          const printH = pageH - margin * 2;

          const elW = clone.offsetWidth;
          const elH = clone.scrollHeight;
          if (!elW || !elH) throw new Error("Nothing to render");

          const pxPerMm = elW / printW;
          const maxSlicePxH = printH * pxPerMm;
          const minFill = maxSlicePxH * 0.55;

          const safeMaxHeight = maxSlicePxH * 0.9;
          clone
            .querySelectorAll(".mermaid-diagram svg, .prose img")
            .forEach((el) => {
              const rect = el.getBoundingClientRect();
              if (rect.height > safeMaxHeight) {
                const ratio = safeMaxHeight / rect.height;
                const newW = rect.width * ratio;

                if (el.tagName.toLowerCase() === "svg") {
                  el.setAttribute("height", safeMaxHeight);
                  el.setAttribute("width", newW);
                }
                el.style.height = safeMaxHeight + "px";
                el.style.width = newW + "px";
                el.style.maxHeight = safeMaxHeight + "px";
                el.style.objectFit = "contain";
              }
            });

          const bounds = [];
          const cloneRect = clone.getBoundingClientRect();
          clone
            .querySelectorAll(
              "p, h1, h2, h3, h4, h5, h6, pre, blockquote, ul, ol, table, tr, li, dl, dd, dt, section, figure, hr, .mermaid-diagram",
            )
            .forEach((el) => {
              const rect = el.getBoundingClientRect();
              bounds.push(rect.top - cloneRect.top - 2);
              bounds.push(rect.bottom - cloneRect.top + 2);
            });
          bounds.push(0, elH);
          bounds.sort((a, b) => a - b);

          const starts = [0];
          let current = 0;
          while (current < elH - 1) {
            const pageEnd = Math.min(current + maxSlicePxH, elH);
            let next = pageEnd;
            for (const b of bounds) {
              if (b >= current + minFill && b <= pageEnd) next = b;
            }
            if (next <= current) next = pageEnd;
            starts.push(next);
            current = next;
          }

          const pdf = new jsPDF({
            unit: "mm",
            format: "a4",
            orientation: "portrait",
          });

          const includeHeader = document.getElementById("optHeader").checked;
          const headerTitle =
            document.getElementById("optHeaderTitle").value ||
            "Markdown Previewer";
          const includeFooter = document.getElementById("optFooter").checked;
          const dateStr = new Date().toLocaleDateString();

          pdfProgressText.textContent = "Rendering document...";
          await new Promise((r) => setTimeout(r, 50));

          const fullCanvas = await html2canvas(clone, {
            scale: scale,
            useCORS: true,
            logging: false,
            width: elW,
            height: elH,
            windowWidth: document.documentElement.clientWidth,
            onclone: (doc) => {
              doc.documentElement.classList.remove("dark");
            },
          });

          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = fullCanvas.width;
          const ctx = tempCanvas.getContext("2d", { alpha: false });

          for (let i = 0; i < starts.length - 1; i++) {
            const offset = starts[i];
            const slicePxH = starts[i + 1] - offset;

            await new Promise((r) => setTimeout(r, 0));
            setProgress(
              (i + 1) / (starts.length - 1),
              i + 1 + " / " + (starts.length - 1),
            );

            tempCanvas.height = slicePxH * scale;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            ctx.drawImage(
              fullCanvas,
              0,
              offset * scale,
              fullCanvas.width,
              slicePxH * scale,
              0,
              0,
              tempCanvas.width,
              tempCanvas.height,
            );

            const imgData = tempCanvas.toDataURL("image/jpeg", 0.98);
            const imgHmm = slicePxH / pxPerMm;

            if (i > 0) pdf.addPage();

            pdf.addImage(imgData, "JPEG", margin, margin, printW, imgHmm);

            if (includeHeader) {
              pdf.setFontSize(9);
              pdf.setTextColor(107, 114, 128);
              pdf.text(dateStr, margin, margin - 8);
              pdf.text(headerTitle, pageW - margin, margin - 8, {
                align: "right",
              });
              pdf.setDrawColor(229, 231, 235);
              pdf.line(margin, margin - 4, pageW - margin, margin - 4);
            }

            if (includeFooter) {
              pdf.setFontSize(9);
              pdf.setTextColor(107, 114, 128);
              pdf.text(
                `Page ${i + 1} of ${starts.length - 1}`,
                pageW - margin,
                pageH - margin + 9,
                { align: "right" },
              );
              pdf.setDrawColor(229, 231, 235);
              pdf.line(
                margin,
                pageH - margin + 4,
                pageW - margin,
                pageH - margin + 4,
              );
            }
          }

          if (action === "download") {
            pdfProgressText.textContent = "Saving file...";
            pdfProgressBar.style.width = "100%";
            await new Promise((r) => setTimeout(r, 0));
            pdf.save("markdown-preview.pdf");
          } else if (action === "print") {
            pdfProgressText.textContent = "Opening print dialog...";
            pdfProgressBar.style.width = "100%";
            await new Promise((r) => setTimeout(r, 0));

            const blobUrl = pdf.output("bloburl");
            const iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = blobUrl;
            document.body.appendChild(iframe);

            iframe.onload = () => {
              setTimeout(() => {
                iframe.contentWindow.print();
              }, 100);
            };
          }

          closePdfModal();
        } catch (err) {
          console.error("PDF generation failed:", err);
          pdfProgressText.textContent =
            "Failed to generate document. Please try again.";
          pdfProgressCount.textContent = "";
          pdfProgressBar.style.width = "0%";
        } finally {
          pdfDirectBtn.disabled = false;
          pdfPrintBtn.disabled = false;
          if (clone && clone.parentNode) {
            clone.parentNode.removeChild(clone);
          }
        }
      }

      downloadPdfBtn.addEventListener("click", openPdfModal);
      pdfDirectBtn.addEventListener("click", () => exportDocument("download"));
      pdfPrintBtn.addEventListener("click", () => exportDocument("print"));
      pdfCancelBtn.addEventListener("click", closePdfModal);
      pdfModalBackdrop.addEventListener("click", closePdfModal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !pdfModal.classList.contains("hidden")) {
          closePdfModal();
        }
      });

      const storedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;
      if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
        sunIcon.classList.remove("hidden");
        moonIcon.classList.add("hidden");
      }
      mermaid.initialize(getMermaidConfig());

      themeToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        sunIcon.classList.toggle("hidden", !isDark);
        moonIcon.classList.toggle("hidden", isDark);
        mermaid.initialize(getMermaidConfig());
        renderMermaidDiagrams(preview.querySelectorAll(".mermaid-diagram"));
      });

      editor.value = exampleMarkdown;
      renderMarkdown();
    </script>
